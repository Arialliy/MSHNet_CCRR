project: MSHNet-TG-SCA-CCRR
stage: head_only
version: v2_target_guarded_component
seed: 42

protocol:
  use_original_img_idx: true
  validation_split: null
  development_selection_source: official_test
  epochs: 1000
  test_start_epoch: 500
  test_every_epoch_after_start: true
  probability_threshold: 0.5
  keep_best_miou: true
  keep_best_pd: true
  keep_best_pareto: true
  pareto_requires_zero_target_deletion: true
  pareto_requires_target_guard_recall: 0.99
  pareto_semantics: safe_non_inferior
  publication_go_requires_real_false_alarm_improvement: true

candidate:
  proposal_threshold: 0.2
  output_threshold: 0.5
  exact_component_aligned: true
  min_area: 1
  max_area: 1024

feature:
  sources: [x_d0, x_d1, x_d2]
  fused_channels: 32
  candidate_pooling: avg_max_topk
  topk_ratio: 0.125
  minimum_topk: 1
  roi_size: 15

selection:
  default_action: keep
  risk_threshold: 2.0
  quality_veto_threshold: 0.2
  guard_veto_threshold: 0.2
  risk_alpha: 1.0
  guard_alpha: 1.0
  action_temperature: 0.05
  quality_temperature: 0.05
  guard_temperature: 0.05

rectification:
  suppression_only: true
  recovery: false
  remove_threshold: 0.45
  output_threshold: 0.5

loss:
  lambda_refined: 0.5
  lambda_clutter_cls: 1.0
  lambda_quality: 1.0
  lambda_action_risk: 1.0
  lambda_rank: 0.1
  lambda_target_guard: 2.0
  target_harm_weight: 20.0
  target_tail_weight: 5.0
  target_tail_temperature: 0.1
  missed_clutter_weight: 1.0
  fp_value_beta: 2.0
  fp_value_max: 3.0
  target_guard_positive_weight: 4.0
  target_guard_fn_weight: 2.0
  target_guard_tail_temperature: 0.1

data:
  datasets: [IRSTD-1K, NUAA-SIRST, NUDT-SIRST]
  train_manifest: datasets/<dataset>/img_idx/train_<dataset>.txt
  test_manifest: datasets/<dataset>/img_idx/test_<dataset>.txt
  independent_validation: false

checkpoint:
  schema: mshnet-tg-sca-ccrr-weight/v1
  files:
    mIoU: best_miou.pkl
    Pd: best_pd.pkl
    Pareto: best_pareto.pkl
    Pareto_status: pareto_status.json
